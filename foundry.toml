[profile.default]
src = "src"
out = "out"
libs = ["lib", "dependencies"]
# Preserve the historical CREATE2 creation code across Foundry updates.
solc_version = "0.8.28"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 15

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
