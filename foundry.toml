[profile.default]
src = "src"
out = "out"
libs = ["lib", "dependencies"]
optimizer = true
optimizer_runs = 15
via_ir = true
# Run all calls of a test function in one transaction, not one transaction for each call.
# The deploy-script tests need this. A fork test runs a full upgrade script, which uses more gas than one block holds.
# Other script tests check that the deployer's nonce does not change. A transaction for each call changes it.
isolate = false
extra_output_files = ['abi']
fs_permissions = [
    { access = "read-write", path = "./script/res" },
    { access = "read", path = "./test/res" }
]

[rpc_endpoints]
ethereum        = { endpoint = "${RPC_URL_ETHEREUM}", retries = 20, retry_backoff = 6000, compute_units_per_second = 100 }
base            = { endpoint = "${RPC_URL_BASE}", retries = 20, retry_backoff = 6000, compute_units_per_second = 100 }
sepolia         = { endpoint = "${RPC_URL_SEPOLIA}", retries = 20, retry_backoff = 6000, compute_units_per_second = 100 }
base_sepolia    = { endpoint = "${RPC_URL_BASE_SEPOLIA}", retries = 20, retry_backoff = 6000, compute_units_per_second = 100 }

[profile.ci]
# inherits [profile.default]

[fmt]
sort_imports = true

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
