name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: |
          forge --version

      # Disabled for now until we have a less-disruptive workflow
#      - name: Run Forge fmt
#        run: |
#          forge fmt --check
#        id: fmt

      - name: Run Forge build
        run: |
          forge build --via-ir --sizes
        id: build

      - name: Run Forge tests
        env:
          FOUNDRY_ETH_RPC_URL: "https://base-sepolia.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_KEY }}"
          PRIVATE_KEY_MAIN: "${{ secrets.DEPLOYER_PRIVATE_KEY }}"
          TEST_KEY: "${{ secrets.DEPLOYER_PRIVATE_KEY }}"
        # TODO skip UpgradeDealManagerTest for now because it depends on hard-coded addresses, but
        #  somehow the CICD environment could not produce the same addresses as locally does
        run: |
          forge test --via-ir -vvv --nmc UpgradeDealManagerTest
        id: test
