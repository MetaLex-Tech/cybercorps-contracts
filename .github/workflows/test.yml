name: CI

on:
  # push to develop and pull_request only to avoid flooding the RPC
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  size:
    name: Build sizes
    runs-on: ubuntu-latest
    environment: test
    outputs:
      cache_key: ${{ steps.key.outputs.cache_key }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned. Unpinned, CI takes whatever stable is that day, and tests can break with no repo change.
          # Raise this deliberately.
          version: v1.8.5

      - name: Show Forge version
        run: forge --version

      - name: Compute build cache key
        id: key
        run: |
          hash="$(git ls-files -s -- foundry.toml remappings.txt .gitmodules src test script lib dependencies | sha256sum | cut -d' ' -f1)"
          echo "cache_key=forge-build-v1-solc0.8.28-${hash}" >> "$GITHUB_OUTPUT"

      - name: Restore build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cache
            out
          key: ${{ steps.key.outputs.cache_key }}
          restore-keys: forge-build-v1-solc0.8.28-

      - name: Compile contracts and tests
        run: forge build --use solc:0.8.28 --via-ir --optimize --optimizer-runs 15

      # Save cache before `--sizes --skip test script` so the cache keeps all
      # test and script entries for the downstream unit and fork jobs.
      - name: Save build cache
        if: steps.build-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            cache
            out
          key: ${{ steps.key.outputs.cache_key }}

      - name: Build
        run: forge build --use solc:0.8.28 --via-ir --optimize --optimizer-runs 15 --sizes --skip test script

  unit:
    name: Unit tests
    needs: size
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned. Unpinned, CI takes whatever stable is that day, and tests can break with no repo change.
          # Raise this deliberately.
          version: v1.8.5

      - name: Show Forge version
        run: forge --version

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cache
            out
          key: ${{ needs.size.outputs.cache_key }}
          restore-keys: forge-build-v1-solc0.8.28-

      - name: Unit tests
        run: forge test --use solc:0.8.28 --via-ir --optimize --optimizer-runs 15 -vvv --nmc '(ForkTest|AdhocTest)'

  fork:
    name: Fork tests
    needs: size
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned. Unpinned, CI takes whatever stable is that day, and tests can break with no repo change.
          # Raise this deliberately.
          version: v1.8.5

      - name: Show Forge version
        run: forge --version

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cache
            out
          key: ${{ needs.size.outputs.cache_key }}
          restore-keys: forge-build-v1-solc0.8.28-

      - name: Fork tests
        env:
          RPC_URL_ETHEREUM: "${{ secrets.RPC_URL_ETHEREUM }}"
          RPC_URL_BASE: "${{ secrets.RPC_URL_BASE }}"
          RPC_URL_SEPOLIA: "${{ secrets.RPC_URL_SEPOLIA }}"
          RPC_URL_BASE_SEPOLIA: "${{ secrets.RPC_URL_BASE_SEPOLIA }}"
          RPC_URL_ARBITRUM: "${{ secrets.RPC_URL_ARBITRUM }}"
          RPC_URL_ROBINHOOD: "${{ secrets.RPC_URL_ROBINHOOD }}"
          RPC_URL_ROBINHOOD_TESTNET: "${{ secrets.RPC_URL_ROBINHOOD_TESTNET }}"
        # `--threads 1` is used in combination with endpoint retry settings in foundry.toml to avoid getting rate limited
        run: forge test --use solc:0.8.28 --via-ir --optimize --optimizer-runs 15 -vvv --threads 1 --mc ForkTest --nmc AdhocTest
