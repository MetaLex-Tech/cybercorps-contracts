name: CI

on:
  # push to develop and pull_request only to avoid flooding the RPC
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  size:
    name: Build sizes
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned. Unpinned, CI takes whatever stable is that day, and tests can break with no repo change.
          # Raise this deliberately.
          version: v1.8.5

      - name: Show Forge version
        run: forge --version

      - name: Build
        run: forge build --use solc:0.8.28 --via-ir --optimize --optimizer-runs 15 --sizes --skip test script

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned. Unpinned, CI takes whatever stable is that day, and tests can break with no repo change.
          # Raise this deliberately.
          version: v1.8.5

      - name: Show Forge version
        run: forge --version

      - name: Unit tests
        run: forge test --use solc:0.8.28 --via-ir --optimize --optimizer-runs 15 -vvv --nmc '(ForkTest|AdhocTest)'

  fork:
    name: Fork tests
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned. Unpinned, CI takes whatever stable is that day, and tests can break with no repo change.
          # Raise this deliberately.
          version: v1.8.5

      - name: Show Forge version
        run: forge --version

      - name: Fork tests
        env:
          RPC_URL_ETHEREUM: "${{ secrets.RPC_URL_ETHEREUM }}"
          RPC_URL_BASE: "${{ secrets.RPC_URL_BASE }}"
          RPC_URL_SEPOLIA: "${{ secrets.RPC_URL_SEPOLIA }}"
          RPC_URL_BASE_SEPOLIA: "${{ secrets.RPC_URL_BASE_SEPOLIA }}"
        # `--threads 1` is used in combination with endpoint retry settings in foundry.toml to avoid getting rate limited
        run: forge test --use solc:0.8.28 --via-ir --optimize --optimizer-runs 15 -vvv --threads 1 --mc ForkTest --nmc AdhocTest
